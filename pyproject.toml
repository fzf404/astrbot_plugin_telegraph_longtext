[project]
name = "astrbot-plugin-telegraph-longtext"
version = "1.1.0"
description = "Publish long AstrBot replies to Telegraph."
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11.18,<4"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
